<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vault Jukebox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 29, 47, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #ff334b;
      --accent-glow: rgba(255, 51, 75, 0.35);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --surface: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top right, #1e112a, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }

    .container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
    }

    .logo-badge {
      background: var(--accent);
      color: white;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 800;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.2);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }

    /* Card styles */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    /* Player card */
    .player-card {
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: relative;
      overflow: hidden;
    }

    .player-card::before {
      content: '';
      position: absolute;
      top: -50px;
      right: -50px;
      width: 140px;
      height: 140px;
      background: var(--accent-glow);
      filter: blur(50px);
      border-radius: 50%;
      pointer-events: none;
    }

    .track-info {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .album-art {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      background: var(--surface);
      object-fit: cover;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }

    .track-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      gap: 4px;
    }

    .track-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progress bar */
    .progress-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-bar {
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff334b, #ff758c);
      width: 0%;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 4px;
    }

    .btn-ctrl {
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .btn-ctrl:hover {
      color: var(--accent);
      transform: scale(1.1);
    }

    .btn-ctrl:active {
      transform: scale(0.95);
    }

    .btn-play {
      width: 58px;
      height: 58px;
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn-play:hover {
      background: #ff475e;
      color: white;
      transform: scale(1.06);
    }

    .btn-secondary {
      width: 42px;
      height: 42px;
      background: rgba(255, 255, 255, 0.05);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Volume Slider */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 6px;
    }

    .volume-slider {
      flex: 1;
      accent-color: var(--accent);
      height: 4px;
      border-radius: 2px;
      cursor: pointer;
    }

    /* Add form */
    .add-form {
      display: flex;
      gap: 10px;
    }

    .input-box {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }

    .input-box:focus {
      border-color: var(--accent);
    }

    .btn-add {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 0 20px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px var(--accent-glow);
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-add:hover {
      background: #ff475e;
      transform: translateY(-1px);
    }

    .btn-add:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Queue list */
    .queue-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .queue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .queue-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .btn-clear {
      background: transparent;
      border: none;
      color: #ef4444;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .btn-clear:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .queue-list::-webkit-scrollbar {
      width: 4px;
    }

    .queue-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .queue-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      gap: 12px;
    }

    .queue-item-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }

    .queue-item-title {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .queue-item-index {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .btn-del {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: color 0.2s;
    }

    .btn-del:hover {
      color: #ef4444;
    }

    .empty-queue {
      text-align: center;
      padding: 30px 10px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <span class="logo-badge">VAULT</span>
        <span>Jukebox</span>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>Dual Speakers</span>
      </div>
    </header>

    <!-- Now Playing Card -->
    <div class="glass-card player-card">
      <div class="track-info">
        <div class="album-art" id="art">🎵</div>
        <div class="track-details">
          <div class="track-title" id="title">Nothing Playing</div>
          <div class="track-artist" id="artist">Paste a YouTube link below</div>
        </div>
      </div>

      <div class="progress-container">
        <div class="progress-bar" id="progressBar" onclick="seek(event)">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-labels">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn-ctrl btn-secondary" onclick="cmd('seek_back')" title="Back 10s">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
        </button>
        <button class="btn-ctrl btn-play" id="playBtn" onclick="togglePlay()" title="Play / Pause">
          <svg id="playIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>
        </button>
        <button class="btn-ctrl btn-secondary" onclick="cmd('next')" title="Next Track">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
        <button class="btn-ctrl btn-secondary" onclick="cmd('stop')" title="Stop">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
        </button>
      </div>

      <div class="volume-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--text-muted);"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        <input type="range" class="volume-slider" id="volSlider" min="0" max="80" value="40" oninput="setVol(this.value)">
        <span id="volVal" style="font-size: 0.8rem; color: var(--text-muted); width: 32px;">40%</span>
      </div>
    </div>

    <!-- Add Track Input -->
    <div class="glass-card">
      <form class="add-form" onsubmit="addTrack(event)">
        <input type="text" id="urlInput" class="input-box" placeholder="Paste YouTube link or search query..." required autocomplete="off">
        <button type="submit" id="addBtn" class="btn-add">
          <span>Add</span>
        </button>
      </form>
    </div>

    <!-- Queue List -->
    <div class="queue-section">
      <div class="queue-header">
        <span class="queue-title">Up Next</span>
        <button class="btn-clear" onclick="cmd('clear')">Clear All</button>
      </div>
      <div class="queue-list" id="queueList">
        <div class="empty-queue">Queue is empty</div>
      </div>
    </div>
  </div>

  <script>
    let isPlaying = false;
    let trackDuration = 0;

    function formatTime(secs) {
      if (!secs || isNaN(secs) || secs < 0) return "0:00";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        
        isPlaying = !data.paused && data.playing;
        document.getElementById('title').textContent = data.title || "Nothing Playing";
        document.getElementById('artist').textContent = data.artist || (data.playing ? "YouTube Audio" : "Idle");

        if (data.art) {
          document.getElementById('art').innerHTML = `<img src="${data.art}" style="width:100%;height:100%;border-radius:14px;object-fit:cover;">`;
        } else {
          document.getElementById('art').textContent = data.playing ? "🎵" : "💤";
        }

        // Play/Pause icon
        const playIcon = document.getElementById('playIcon');
        if (isPlaying) {
          playIcon.innerHTML = `<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>`;
        } else {
          playIcon.innerHTML = `<polygon points="6 4 20 12 6 20 6 4"/>`;
        }

        // Progress
        trackDuration = data.duration || 0;
        const current = data.time_pos || 0;
        document.getElementById('currentTime').textContent = formatTime(current);
        document.getElementById('duration').textContent = formatTime(trackDuration);
        const percent = trackDuration > 0 ? (current / trackDuration) * 100 : 0;
        document.getElementById('progressFill').style.width = `${percent}%`;

        // Volume (capped at 80%, default 40%)
        if (!document.getElementById('volSlider').matches(':active')) {
          const clampedVol = Math.min(80, data.volume !== undefined ? data.volume : 40);
          document.getElementById('volSlider').value = clampedVol;
          document.getElementById('volVal').textContent = `${Math.round(clampedVol)}%`;
        }

        // Queue
        renderQueue(data.queue || []);
      } catch (e) {
        console.error("Status fetch error", e);
      }
    }

    function renderQueue(queue) {
      const qContainer = document.getElementById('queueList');
      if (queue.length === 0) {
        qContainer.innerHTML = '<div class="empty-queue">Queue is empty</div>';
        return;
      }

      qContainer.innerHTML = queue.map((item, idx) => `
        <div class="queue-item">
          <div class="queue-item-info">
            <div class="queue-item-title">${item.title}</div>
            <div class="queue-item-index">#${idx + 1}</div>
          </div>
          <button class="btn-del" onclick="delTrack(${idx})" title="Remove">✕</button>
        </div>
      `).join('');
    }

    async function cmd(action, value = null) {
      await fetch('/api/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, value })
      });
      fetchStatus();
    }

    function togglePlay() {
      cmd('toggle_play');
    }

    function setVol(val) {
      document.getElementById('volVal').textContent = `${val}%`;
      cmd('volume', parseFloat(val));
    }

    function seek(event) {
      const bar = document.getElementById('progressBar');
      const rect = bar.getBoundingClientRect();
      const clickPos = (event.clientX - rect.left) / rect.width;
      if (trackDuration > 0) {
        cmd('seek', clickPos * trackDuration);
      }
    }

    async function addTrack(e) {
      e.preventDefault();
      const input = document.getElementById('urlInput');
      const val = input.value.trim();
      if (!val) return;

      const btn = document.getElementById('addBtn');
      btn.disabled = true;
      btn.innerHTML = '<span>Adding...</span>';

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      try {
        await fetch('/api/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: val }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        input.value = '';
        // If queue was empty and not playing, show immediate loading placeholder
        if (!isPlaying) {
          document.getElementById('title').textContent = "Buffering stream...";
          document.getElementById('artist').textContent = val;
        }
      } catch (err) {
        console.warn("Add track timed out or failed:", err);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Add</span>';
        setTimeout(fetchStatus, 300);
      }
    }

    async function delTrack(index) {
      cmd('remove', index);
    }

    // Adaptive, CPU-friendly polling:
    // - 1s when active music is playing so progress bar is smooth
    // - 3.5s when idle/stopped to minimize server network & CPU usage
    // - 10s if the browser tab is hidden / in background
    let pollTimer = null;
    async function pollLoop() {
      await fetchStatus();
      let delay = isPlaying ? 1000 : 3500;
      if (document.hidden) {
        delay = 10000;
      }
      pollTimer = setTimeout(pollLoop, delay);
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        clearTimeout(pollTimer);
        pollLoop();
      }
    });

    pollLoop();
  </script>
</body>
</html>
